<style>
:root{
  --bg:#EEF2EF;--surface:#FFFFFF;--ink:#17231F;--muted:#5E6E68;--line:#D5DDD8;
  --teal:#1F7A2E;--grad:linear-gradient(135deg,#0B5A2A 0%,#24822F 50%,#8CC63F 100%);--teal-ink:#FFFFFF;--learn:#146B3F;--learn-soft:#D9EFE3;--rev:#D9670B;--rev-soft:#FCEBDC;--rep:#7A4FC0;--rep-soft:#EEE6F8;
  --gold:#A67C1E;--valid:#1FD65F;--warn:#D32F2F;--warn-soft:#F7E2DC;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1715;--surface:#18221F;--ink:#E6EDE9;--muted:#9AAAA3;--line:#2A3733;
  --teal:#7CC47A;--teal-ink:#0B1513;--learn:#5CC79A;--learn-soft:#193A2C;--rev:#F59A45;--rev-soft:#3D2814;--rep:#B794F4;--rep-soft:#2E2440;
  --gold:#D9B25A;--valid:#39FF7A;--warn:#FF5B4F;--warn-soft:#3D211B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1715;--surface:#18221F;--ink:#E6EDE9;--muted:#9AAAA3;--line:#2A3733;
  --teal:#7CC47A;--teal-ink:#0B1513;--learn:#5CC79A;--learn-soft:#193A2C;--rev:#F59A45;--rev-soft:#3D2814;--rep:#B794F4;--rep-soft:#2E2440;
  --gold:#D9B25A;--valid:#39FF7A;--warn:#FF5B4F;--warn-soft:#3D211B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header.top{background:var(--surface);margin:-20px -16px 16px;padding:14px 16px 12px;border-radius:0 0 22px 22px;box-shadow:0 4px 14px rgba(11,90,42,.08);position:relative;text-align:center}
header.top::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;border-radius:3px;background:var(--grad)}
.hlogo{height:78px;width:auto;display:block;margin:0 auto;border-radius:10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
header.top .sub{margin:0;font-size:.92rem;color:var(--ink);font-weight:500}
.hrole{display:flex;align-items:center;gap:6px}
header.top .role{margin-bottom:0}
.bsub .ar,.lhero .lar{font-family:"Amiri","Traditional Arabic","Geeza Pro",serif}
.lhero{text-align:center;margin:6px 0 18px}
.lhero img{width:min(230px,62%);height:auto;margin:0 auto;display:block}
.lhero .lar{font-size:1.9rem;color:var(--teal);line-height:1.2}
.lhero p{color:var(--muted);margin:4px 0 0;font-size:.92rem}
h1.lh{text-align:center;font-size:1.25rem;margin:0 0 12px}
h1{font-size:1.45rem;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:8px 10px;border-radius:999px;font-size:.88rem;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--grad);color:#fff;font-weight:500}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:.85rem}

/* progression : la bande des 30 juz */
.prog{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.prog-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prog-num{font-size:1.9rem;font-weight:600;line-height:1}
.prog-num small{font-size:.9rem;font-weight:400;color:var(--muted)}
.juz{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin:14px 0 8px}
.juz i{height:22px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.juz i b{position:absolute;inset:0 auto 0 0;background:var(--learn)}
.juz-legend{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.prog-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted);margin-top:10px}
.prog-meta strong{color:var(--ink);font-weight:500}
.prog-meta .late strong{color:var(--warn)}

/* calendrier */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 10px 10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.cal-head h2{font-size:1rem;font-weight:500;margin:0;text-transform:capitalize}
.cal-head button{border:0;background:none;width:36px;height:36px;border-radius:10px;font-size:1.1rem}
.cal-head button:hover{background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{font-size:.72rem;color:var(--muted);text-align:center;padding:4px 0}
.day{border:0;background:none;border-radius:10px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px}
.day .n{font-size:.88rem;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.day.today .n{border:1.5px solid var(--teal);font-weight:600}
.day.sel{background:var(--bg)}
.day.sel .n{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.day.out{visibility:hidden}
.marks{display:flex;gap:4px;height:10px}
.m{width:10px;height:10px;border-radius:50%;border:2.5px solid;display:inline-block}
.m.l{border-color:var(--learn)} .m.r{border-color:var(--rev)} .m.p{border-color:var(--rep)}
.m.l.done{background:var(--learn)} .m.r.done{background:var(--rev)} .m.p.done{background:var(--rep)}
.m.miss{border-color:var(--warn);background:var(--warn)}
.m.val{background:var(--valid)!important;border-color:var(--valid)!important}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);padding:10px 6px 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* détail du jour */
.detail{margin-top:16px}
.detail h3{font-size:1rem;font-weight:500;margin:0 0 10px;text-transform:capitalize}
.task{border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.task.l{background:var(--learn-soft)} .task.r{background:var(--rev-soft)} .task.p{background:var(--rep-soft)}
.task .body{flex:1;min-width:0}
.task .kind{font-size:.78rem;font-weight:500}
.task.l .kind{color:var(--learn)} .task.r .kind{color:var(--rev)} .task.p .kind{color:var(--rep)}
.task .what{font-size:1.05rem;font-weight:500;margin:2px 0}
.task .surah{font-size:.85rem;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ar{font-family:"Amiri","Traditional Arabic","Geeza Pro",serif;font-size:1.15rem;color:var(--ink)}
.check{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid;background:var(--surface);display:grid;place-items:center}
.task.l .check{border-color:var(--learn)} .task.r .check{border-color:var(--rev)} .task.p .check{border-color:var(--rep)}
.task.l .check[aria-pressed="true"]{background:var(--learn);color:var(--surface)}
.task.r .check[aria-pressed="true"]{background:var(--rev);color:var(--surface)}
.task.p .check[aria-pressed="true"]{background:var(--rep);color:var(--surface)}
.nk.p{background:var(--rep)}
.check svg{width:20px;height:20px;opacity:0}
.check[aria-pressed="true"] svg{opacity:1}
.status{font-size:.8rem;font-weight:500;flex:none}
.empty{color:var(--muted);font-size:.92rem;padding:14px 4px}

/* formulaire */
.form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px}
.field{margin-bottom:20px}
.field>label,.field>.lab{display:block;font-weight:500;font-size:.95rem;margin-bottom:4px}
.hint{font-size:.8rem;color:var(--muted);margin:0 0 8px}
input[type=text],input[type=number],input[type=date],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.chips.days .chip{min-width:44px;padding:8px 0;text-align:center}
.estimate{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:.88rem;margin-bottom:16px}
.primary{width:100%;border:0;border-radius:14px;background:var(--grad);color:#fff;padding:14px;font-weight:500;font-size:1rem}
.primary:disabled{opacity:.45;cursor:default}
.err{color:var(--warn);font-size:.85rem;margin:-8px 0 12px}

/* élèves */
.student{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:block}
.student .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.student .name{font-weight:500}
.student .pages{font-size:.85rem;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0;overflow:hidden}
.bar b{display:block;height:100%;background:var(--learn)}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.stats .late{color:var(--warn);font-weight:500}
.back{border:0;background:none;color:var(--teal);padding:0;margin-bottom:12px;font-size:.9rem}
.note{font-size:.82rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}

.vstat{font-size:.8rem;margin-top:6px;color:var(--muted)}
.vstat.ok{color:var(--gold);font-weight:500} .vstat.wait{color:var(--rev)}
.vbtn{flex:none;border:1.5px solid var(--gold);background:var(--surface);color:var(--gold);border-radius:999px;padding:9px 14px;font-weight:500;font-size:.85rem}
.vbtn.on{background:var(--gold);color:var(--surface)}
.prog-meta .pend strong,.stats .pendb{color:var(--gold);font-weight:500}
.contact{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cbtn{display:inline-flex;align-items:center;border-radius:999px;padding:8px 14px;font-size:.82rem;font-weight:500;text-decoration:none}
.cbtn.wa{background:#1FA855;color:#fff} .cbtn.zm{background:#2D6BEF;color:#fff}
.resetbtn{width:100%;margin-top:12px;border:1.5px solid var(--warn);background:transparent;color:var(--warn);border-radius:14px;padding:12px;font-weight:500}
.resetbox{margin-top:12px;border:1.5px solid var(--warn);background:var(--warn-soft);border-radius:14px;padding:12px 14px;font-size:.9rem}
.resetbox p{margin:0 0 10px}
.chip.danger{background:var(--warn);border-color:var(--warn);color:#fff}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.level{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.level strong{font-size:1.02rem;font-weight:600}
.level span{font-size:.78rem;color:var(--muted);line-height:1.4}
.level[aria-pressed="true"]{border-color:var(--teal);background:var(--surface);box-shadow:0 0 0 1.5px var(--teal)}
.level[aria-pressed="true"] strong{color:var(--teal)}

function ago(iso){

}

function loadChunk(k){if(!M.chunks[k])M.chunks[k]=fetch("mushaf_"+String(k+1).padStart(2,"0")+".json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).catch(e=>{delete M.chunks[k];throw e});return M.chunks[k]}
async function pageData(p){const d=(await loadChunk(Math.min(14,Math.floor((p-1)/40))))[p];if(!M.fonts[p]){const f=new FontFace("QPC"+p,b64buf(d.f));await f.load();document.fonts.add(f);M.fonts[p]=1}return d}
const marksOf=sid=>{const v=sid?(S.vals[sid]||{}):(S.val||{});return(v._marks&&v._marks.m)||{}};
const marksCount=sid=>Object.keys(marksOf(sid)).length;
function marksWrite(sid,m){const all={...(S.vals[sid]||{})};all._marks={at:Date.now(),m};S.vals[sid]=all;if(!S.db)return;writeChain=writeChain.then(()=>S.db.doc("validations/"+sid).set(all)).catch(()=>{S.note="La correction n’a pas pu être enregistrée. Vérifiez votre connexion.";render()})}
function mushafFoot(){const f=document.getElementById("mh-foot");if(!f)return;const n=marksCount(M.sid);const np=Object.keys(marksOf(M.sid)).filter(k=>k.split(":")[0]==String(M.page)).length;
  f.innerHTML=M.teacher?`<div class="mf-t"><strong class="mf-n">${n} mot${n>1?"s":""}</strong> à corriger${np&&np!==n?` (dont ${np} sur cette page)`:""} · enregistré automatiquement</div><div class="mf-b">${np?`<button data-m="clearpage" class="mf-clear">Tout corrigé sur cette page</button>`:""}<button data-m="close" class="mf-ok">Terminer</button></div>`
  :(np?`<div class="mf-t"><strong class="mf-n">⚠ ${np} mot${np>1?"s":""} à corriger</strong> sur cette page : ceux en rouge. Revois-les avant ta prochaine récitation.</div>`:"");f.hidden=!(M.teacher||np)}
function openMushaf(which){M.teacher=!!(S.isOwner&&S.viewing);M.sid=M.teacher?S.viewing:null;
  const R=S.dayRanges;if(!R)return;M.l=which==="l"?R.l:which==="p"?R.p:null;M.r=which==="r"?(R.r||[]):[];if(!M.l&&!M.r.length){M.l=R.l;M.r=R.r||[]}
  const start=which==="p"&&R.p?R.p[0]:which==="l"&&R.l?firstAy(R.l):(M.r[0]?firstAy(M.r[0]):firstAy(R.l));M.page=pageOfAyah(start);
  if(!M.el){M.el=document.createElement("div");M.el.className="mushaf";M.el.setAttribute("role","dialog");M.el.setAttribute("aria-label","Mushaf");document.body.appendChild(M.el);
    M.el.addEventListener("click",ev=>{const w=ev.target.closest(".w[data-wid]");if(w&&M.teacher){const m={...marksOf(M.sid)};const id=w.dataset.wid;if(m[id])delete m[id];else m[id]=1;w.classList.toggle("fx",!!m[id]);marksWrite(M.sid,m);mushafFoot();return}
      const b=ev.target.closest("[data-m]");if(!b)return;const a=b.dataset.m;if(a==="clearpage"){if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Confirmer : tout effacer sur cette page";return}const m={...marksOf(M.sid)};Object.keys(m).forEach(k=>{if(k.split(":")[0]==String(M.page))delete m[k]});marksWrite(M.sid,m);M.el.querySelectorAll(".w.fx").forEach(x=>x.classList.remove("fx"));mushafFoot();return}
      if(a==="close"){closeMushaf();render();return}else if(a==="next"&&M.page<604)showPage(M.page+1);else if(a==="prev"&&M.page>1)showPage(M.page-1)});
    document.addEventListener("keydown",ev=>{if(!M.el||M.el.hidden)return;if(ev.key==="Escape")closeMushaf();if(ev.key==="ArrowLeft"&&M.page<604)showPage(M.page+1);if(ev.key==="ArrowRight"&&M.page>1)showPage(M.page-1)});
    let tx=0,ty=0,tt=0;
    M.el.addEventListener("touchstart",ev=>{if(ev.touches.length!==1)return;tx=ev.touches[0].clientX;ty=ev.touches[0].clientY;tt=Date.now()},{passive:true});
    M.el.addEventListener("touchend",ev=>{const t=ev.changedTouches[0];if(!t||!tt)return;const dx=t.clientX-tx,dy=t.clientY-ty;tt=0;
      if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.5)return;
      if(dx>0&&M.page<604)showPage(M.page+1);else if(dx<0&&M.page>1)showPage(M.page-1)},{passive:true});
    window.addEventListener("resize",sizeMushaf)}
  M.el.hidden=false;document.body.style.overflow="hidden";showPage(M.page);
}
function closeMushaf(){if(M.el)M.el.hidden=true;document.body.style.overflow=""}
function sizeMushaf(){const pg=document.getElementById("mh-page");if(pg)pg.style.setProperty("--w",pg.clientWidth+"px")}
const inR=(y,r)=>!!r&&(Array.isArray(r[0])?r.some(q=>y>=q[0]&&y<q[1]):y>=r[0]&&y<r[1]);
async function showPage(p){
  M.page=p;
  M.el.innerHTML=`<div class="mh-bar"><button data-m="next" ${p>=604?"disabled":""} aria-label="Page suivante">‹ Suivante</button><div class="mh-title">Page ${p}</div><button data-m="prev" ${p<=1?"disabled":""} aria-label="Page précédente">Précédente ›</button><button data-m="close" aria-label="Fermer">✕</button></div>
  <div class="mh-legend">${M.teacher?"✏️ Touchez un mot mal prononcé pour le marquer en rouge. Touchez-le à nouveau pour l’enlever.":M.l?"Les ayat à apprendre sont bien visibles, le reste est estompé.":"Les ayat à réviser sont bien visibles, le reste est estompé."} Glissez le doigt pour tourner la page.</div>
  <div class="mh-body"><div id="mh-page"><p class="mh-msg">Chargement de la page…</p></div></div><div class="mh-foot" id="mh-foot" hidden></div>`;
  try{
    await baseFonts();const d=await pageData(p);if(M.page!==p)return;
    let sur=0,h="";const MK=marksOf(M.sid);const on0=y=>inR(y,M.l)||M.r.some(r=>inR(y,r));const any=d.l.some(l=>l.t==="a"&&l.y.some(on0));const on=y=>on0(y);
    const nextOn=i=>{for(let k=i+1;k<d.l.length;k++)if(d.l[k].t==="a")return on(d.l[k].y[0]);return false};
    d.l.forEach((l,i)=>{
      if(l.t==="s"){sur=l.n;h+=`<div class="ml s${nextOn(i)?"":" dim"}">${SURAH_GLYPH[l.n-1]||""}</div>`;return}
      if(l.t==="b"){h+=`<div class="ml b${nextOn(i)?"":" dim"}">${BISM[sur]||BISM.def}</div>`;return}
      h+=`<div class="ml a ${l.c?"c":"j"}" style="font-family:'QPC${p}'">`+l.w.map((w,j)=>`<span class="w${on(l.y[j])?"":" dim"}${MK[p+":"+i+":"+j]?" fx":""}" data-wid="${p}:${i}:${j}">${w}</span>`).join("")+`</div>`;
    });
    const pg=document.getElementById("mh-page");pg.innerHTML=h;sizeMushaf();mushafFoot();
  }catch(e){const pg=document.getElementById("mh-page");if(pg)pg.innerHTML=`<p class="mh-msg">Impossible de charger cette page du mushaf. Vérifiez votre connexion et réessayez.</p>`}
}

function startLocal(msg){
  S.local=true;S.uid="local";S.note=msg||"";
  try{const raw=localStorage.getItem("hifz-plan");if(raw)S.plan=JSON.parse(raw)}catch(e){}
  S.loaded=true;render();
}
(async()=>{
  await sbReady();const c=window.claude;
  if(!c||!c.use){startLocal("Mode local : votre programme est gardé sur cet appareil seulement.");return}
  const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
  const uid=user?await user.id():null;
  if(!db||!uid){startLocal("Mode local : connectez-vous à Claude pour que votre enseignant puisse suivre votre progression.");return}
  S.db=db;S.uid=uid;S.isOwner=await user.isOwner();
  const timer=setTimeout(()=>{if(!S.loaded){S.note="Connexion lente : les données arriveront dès que possible.";S.loaded=true;render()}},10000);
  db.doc("eleves/"+uid).onSnapshot(snap=>{
    if(!snap.metadata.fromCache)clearTimeout(timer);
    S.plan=snap.exists?snap.data():null;S.loaded=true;render();
  },()=>{clearTimeout(timer);S.note="Impossible de charger votre programme.";S.loaded=true;render()});
  db.doc("config/prof").onSnapshot(snap=>{S.cfg=snap.exists?snap.data():{};render()},()=>{});
  db.doc("config/creneaux").onSnapshot(snap=>{S.slotCfg=snap.exists?snap.data():null;render()},()=>{});
  if(window.SBC){loadResa().then(render);setInterval(()=>loadResa().then(()=>{if(!document.getElementById("bk")||document.getElementById("bk").hidden)render()}),60000)}
  db.doc("validations/"+uid).onSnapshot(snap=>{S.val=snap.exists?snap.data():{};render()},()=>{});
  if(S.isOwner){
    db.collection("validations").onSnapshot(qs=>{const m={};qs.docs.forEach(d=>{m[d.id]=d.data()});S.vals=m;if(S.tab==="eleves")render()},()=>{});
    db.collection("eleves").onSnapshot(qs=>{S.students=qs.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==="eleves")render()},()=>{});
  }
})();
render();
</script>
</body>
</html>
